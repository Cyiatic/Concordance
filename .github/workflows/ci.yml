name: Concordance CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check catalog JavaScript
        run: node --check viewer/catalog_app.js

      - name: Check capture and visible-adapter JavaScript
        run: |
          node --check viewer/capture_app.js
          node --check tools/discord_visible_capture.js
          node --check tools/discord_visible_evidence.js

      - name: Build and verify synthetic viewer
        run: |
          python -m discord_archive validate fixtures/sample/archive.json
          python -m discord_archive audit-media --input fixtures/sample/archive.json
          python -m discord_archive build fixtures/sample/archive.json --output dist/sample
          python -m discord_archive verify dist/sample
