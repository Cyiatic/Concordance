[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-archive"
version = "0.1.0"
description = "Local-first normalized conversation archives with an offline viewer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
discord-archive = "discord_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"viewer" = ["viewer/template.html"]
"viewer/assets" = ["viewer/assets/concordance-mark.png"]
