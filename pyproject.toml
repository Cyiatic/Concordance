[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concordance"
version = "0.1.0"
description = "Concordance: local-first normalized conversation archives with an offline viewer"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cyiatic" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Cyiatic/Concordance"
Repository = "https://github.com/Cyiatic/Concordance"
Issues = "https://github.com/Cyiatic/Concordance/issues"

[project.optional-dependencies]
secure = ["cryptography>=42"]

[project.scripts]
concordance = "concordance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"viewer" = ["viewer/template.html", "viewer/catalog_template.html", "viewer/catalog_app.js", "viewer/capture_template.html", "viewer/capture_app.js"]
"viewer/assets" = ["viewer/assets/concordance-mark.png"]
